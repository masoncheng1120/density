<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Density Lab - Worksheet</title>
  <style>
    body { margin: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%); color: #0c2d48; min-height: 100vh; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 32px; }
    .card { background: #fff; border: 2px solid #2563eb; border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 6px rgba(37, 99, 235, 0.1); }
    .badge { display: inline-block; background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); color: #fff; border-radius: 999px; padding: 10px 16px; font-weight: 900; font-size: 14px; }
    .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin: 20px 0; }
    .chip { border-radius: 16px; border: 3px solid #2563eb; padding: 20px; font-weight: 800; background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%); font-size: 18px; text-align: center; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15); transition: transform 0.2s; }
    .chip:hover { transform: scale(1.05); }
    .block { margin: 20px 0; background: linear-gradient(135deg, #cffafe 0%, #a5f3fc 100%); border: 2px solid #06b6d4; border-radius: 14px; padding: 14px 16px; font-weight: 600; font-size: 15px; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; border: 2px solid #2563eb; border-radius: 12px; overflow: hidden; }
    th, td { border-bottom: 2px solid #e0f2fe; padding: 14px; text-align: left; }
    th { background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%); font-size: 13px; text-transform: uppercase; font-weight: 900; color: #0c2d48; }
    tr:hover td { background: #f0f9ff; }
    select, input, button { font: inherit; }
    select, input { width: 100%; border: 2px solid #2563eb; border-radius: 10px; padding: 11px 12px; background: #f0f9ff; color: #0c2d48; font-weight: 600; }
    select:focus, input:focus { outline: none; border-color: #1e40af; background: #e0f2fe; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
    button, a.btn { border: 0; text-decoration: none; background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); color: #fff; border-radius: 12px; padding: 12px 18px; font-weight: 900; cursor: pointer; transition: transform 0.1s; }
    button:hover, a.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(37, 99, 235, 0.3); }
    .muted { color: #0c663c; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="missing" style="display:none;">
      <h2>Missing Data</h2>
      <p class="muted">Please complete chatbot first.</p>
      <a class="btn" href="index.html">Go to Chatbot</a>
    </div>

    <div id="main" style="display:none;">
      <div class="card" id="head"></div>
      <div class="card" id="sheet"></div>
    </div>
  </div>

  <script>
    const LAB_PASSWORD = "WhoareweCWCC";

    const OBJECTS = [
      { label: "Metal Coin", density: 7.8 },
      { label: "Fresh Grape", density: 1.03 },
      { label: "Lego", density: 0.8 },
      { label: "Ping Pong Ball", density: 0.08 },
      { label: "Eraser Piece", density: 1.2 },
      { label: "Wax Chunk", density: 0.95 }
    ];

    const LIQUIDS = ["Cooking Oil", "Colored Water", "Dish Soap", "Honey"];

    const previewMode = new URLSearchParams(window.location.search).get("preview") === "1";
    let profile = JSON.parse(localStorage.getItem("DLAB_PROFILE") || "null");
    let result = JSON.parse(localStorage.getItem("DLAB_RESULT") || "null");

    if ((!profile || !result || result.level !== "L1") && !previewMode) {
      document.getElementById("missing").style.display = "block";
    } else {
      if (!profile || !result || result.level !== "L1") {
        profile = { name: "Preview Student", groupLetter: "A", groupSize: 5 };
        result = { level: "L1", team: "blue" };
      }
      document.getElementById("main").style.display = "block";
      render();
    }

    function hashSeed(text) {
      let hash = 2166136261;
      for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return hash >>> 0;
    }

    function seededShuffle(items, seedText) {
      const out = [...items];
      let seed = hashSeed(seedText);
      const rnd = () => {
        seed += 0x6d2b79f5;
        let t = seed;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(rnd() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
      }
      return out;
    }

    function assignL1() {
      // Distribute all objects among group members, no overlap, all covered
      const shuffled = seededShuffle(OBJECTS, `${profile.groupLetter}:L1`);
      const groupSize = Math.max(1, profile.groupSize);
      // Calculate how many objects per student (some may get more if not divisible)
      const base = Math.floor(shuffled.length / groupSize);
      const extra = shuffled.length % groupSize;
      // Determine this student's index in group.
      let idx = hashSeed(`${profile.name}:${profile.groupLetter}`) % groupSize;
      // Assign objects
      let start = idx * base + Math.min(idx, extra);
      let count = base + (idx < extra ? 1 : 0);
      let primary = shuffled.slice(start, start + count);
      return { primary };
    }

    function render() {
      const assigned = assignL1();
      document.getElementById("head").innerHTML = `
        <div class="badge">🔵 Team Blue - Builder</div>
        <div style="margin-top:8px; font-size:20px; font-weight:900;">Worksheet: Visual Placement</div>
        <div class="muted" style="margin-top:5px;">${profile.name} | Group ${profile.groupLetter} (${profile.groupSize} members)</div>
      `;

      document.getElementById("sheet").innerHTML = `
        <div class="block"><b>Now, go to Mr. Mason, Ms Marine or Ms Yoyo for your two assigned items.</b></div>
        <div class="chips">${assigned.primary.map(o => `<span class=\"chip\">${o.label} (${o.density} g/cm3)</span>`).join("")}</div>
        <div class="block"><b>🧪 What You Do:</b> Drop your assigned object(s) into the density column. Watch carefully where each one settles (floats or sinks).</div>
        <div class="block" style="background: linear-gradient(135deg, #a5f3fc 0%, #7ee8ff 100%); border-color: #06b6d4;"><b>📝 Record Below:</b> For each object, answer both questions: first choose whether it settled at the top or the bottom, then choose which liquid layer it settled in.</div>
        <table>
          <thead><tr><th>Object</th><th>Question 1: My object is on the...</th><th>Question 2: Which liquid?</th></tr></thead>
          <tbody>
            ${assigned.primary.map((o, i) => `
              <tr>
                <td>${o.label}</td>
                <td>
                  <select id="p-${i}">
                    <option>Top of</option>
                    <option>Bottom of</option>
                  </select>
                </td>
                <td>
                  <select id="liquid-${i}">
                    ${LIQUIDS.map((liquid) => `<option>${liquid}</option>`).join("")}
                  </select>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
        <div style="margin-top:10px;">
          <label>Teacher Password To Continue</label>
          <input id="pw" type="password" placeholder="Enter teacher password" />
        </div>
        <div class="row">
          <button id="saveBtn" type="button">Save Worksheet</button>
          <a class="btn" id="nextBtn" href="discussion.html">Go To Discussion</a>
        </div>
      `;

      document.getElementById("saveBtn")?.addEventListener("click", () => {
        const responses = assigned.primary.map((o, i) => ({
          object: o.label,
          position: document.getElementById(`p-${i}`).value,
          liquid: document.getElementById(`liquid-${i}`).value
        }));
        localStorage.setItem("DLAB_WORKSHEET", JSON.stringify({
          level: "L1",
          team: "blue",
          profile,
          primary: assigned.primary.map(x => x.label),
          responses
        }));
        alert("Worksheet saved.");
      });

      document.getElementById("nextBtn")?.addEventListener("click", (e) => {
        if (document.getElementById("pw").value !== LAB_PASSWORD) {
          e.preventDefault();
          alert("Incorrect teacher password.");
        }
      });
    }
  </script>
</body>
</html>
